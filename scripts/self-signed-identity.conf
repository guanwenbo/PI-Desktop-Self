# Code signing identity used by every macOS release of this fork.
#
# There is no Apple Developer ID here on purpose: the macOS bundle is signed
# with a self-signed certificate that every build machine must carry. Because a
# self-signed certificate produces a designated requirement pinned to the
# certificate hash (not to a per-build cdhash), Squirrel.Mac accepts an update
# built on another machine as long as it carries this same certificate.
#
# Changing either value below breaks in-app updates for every installed build:
# existing installs compare the update against the requirement baked into the
# running app, so a new certificate is only reachable through a manual install.
#
# Keep the private key (.p12) outside this repository and copy it to every
# machine that builds a release. See docs/release-self-signed-macos.md.
IDENTITY="PI-Desktop Self Signed"
FINGERPRINT="A982BD01C82A36858F4E5856C262E94CDCCD917B"
